name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resumable_test
          POSTGRES_USER: resumable
          POSTGRES_PASSWORD: resumable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resumable -d resumable_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RESUMABLE_TEST_DATABASE_URL: postgres://resumable:resumable@localhost:5432/resumable_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: rustup toolchain install 1.85.0 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - run: cargo fetch --locked

      - run: cargo fmt --all -- --check

      - run: cargo check --workspace --locked

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test -p resumable -p resumable-worker --locked

      - run: cargo test -p resumable-store-postgres-sqlx --doc --locked

      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      - run: cargo test -p resumable-store-postgres-sqlx --test postgres --locked

      - name: Run the PostgreSQL worker walkthrough
        run: |
          execution_id=$(cat /proc/sys/kernel/random/uuid)
          status=0
          cargo run --locked -p resumable-store-postgres-sqlx --example postgres_worker -- interrupt "$execution_id" || status=$?
          test "$status" -eq 42
          cargo run --locked -p resumable-store-postgres-sqlx --example postgres_worker -- resume "$execution_id"

      - run: cargo +1.85.0 check --workspace --all-targets --locked
