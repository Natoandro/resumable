name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace crate versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/version.py ensure-version "$RELEASE_TAG"

      - run: cargo fetch --locked

      - name: Publish resumable
        run: cargo publish -p resumable --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for resumable to appear in the registry index
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://crates.io/api/v1/crates/resumable/$version" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "resumable $version did not become available on crates.io" >&2
          exit 1

      - name: Publish resumable-worker
        run: cargo publish -p resumable-worker --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for resumable-worker to appear in the registry index
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://crates.io/api/v1/crates/resumable-worker/$version" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "resumable-worker $version did not become available on crates.io" >&2
          exit 1

      - name: Publish resumable-store-postgres-sqlx
        run: cargo publish -p resumable-store-postgres-sqlx --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
