name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace crate versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/version.py ensure-version "$RELEASE_TAG"

      - run: cargo fetch --locked

      - name: Publish resumable
        run: cargo publish -p resumable --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish resumable-worker
        run: cargo publish -p resumable-worker --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish resumable-store-postgres-sqlx
        run: cargo publish -p resumable-store-postgres-sqlx --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for all crates to appear in the registry index
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          crates=(resumable resumable-worker resumable-store-postgres-sqlx)
          for crate in "${crates[@]}"; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error \
                --user-agent "resumable-release-check (https://github.com/Natoandro/resumable)" \
                "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "$crate $version did not become available on crates.io" >&2
                exit 1
              fi
              sleep 10
            done
          done
