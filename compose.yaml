services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: resumable_test
      POSTGRES_USER: resumable
      POSTGRES_PASSWORD: resumable
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumable -d resumable_test"]
      interval: 5s
      timeout: 5s
      retries: 12
