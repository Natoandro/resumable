[package]
name = "resumable-store-postgres-sqlx"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "PostgreSQL and SQLx store adapter for resumable operations"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Natoandro/resumable"
keywords = ["async", "postgres", "sqlx", "durable", "resumable"]
categories = ["asynchronous", "database"]

[dependencies]
resumable = { version = "0.1.0", path = "../resumable" }
sqlx = { workspace = true, features = ["json", "macros", "postgres", "runtime-tokio", "uuid"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
resumable-worker = { version = "0.1.1", path = "../resumable-worker" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
