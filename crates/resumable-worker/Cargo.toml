[package]
name = "resumable-worker"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "Portable polling worker runtime for resumable operations"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Natoandro/resumable"
keywords = ["async", "worker", "durable", "resumable"]
categories = ["asynchronous", "development-tools"]

[dependencies]
resumable = { version = "0.1.0", path = "../resumable" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
