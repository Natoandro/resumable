[package]
name = "resumable"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "Durable, resumable asynchronous operations composed of named steps"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Natoandro/resumable"
keywords = ["async", "durable", "workflow", "resumable"]
categories = ["asynchronous", "development-tools"]

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt"] }
